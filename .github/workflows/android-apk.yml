name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

          - name: Build Web App & Clean Config
        run: |
          rm -f capacitor.config.ts
          echo '{"appId": "com.almasah.app", "appName": "ALMasah", "webDir": "dist"}' > capacitor.config.json
          npm run build

      - name: Initialize or Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Verify Android Folder Exists
        run: |
          if [ ! -d "android" ]; then
            echo "❌ Error: Android folder was not generated by Capacitor!"
            exit 1
          else
            echo "✅ Android folder verified successfully."
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: masahpro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
