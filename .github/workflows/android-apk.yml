name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Build Web App & Configure Capacitor
        run: |
          rm -f capacitor.config.ts

          echo '{
            "appId": "com.alborihi.masahpro",
            "appName": "masah-pro",
            "webDir": "dist"
          }' > capacitor.config.json

          npm run build

      - name: Create Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Verify Android Project
        run: |
          echo "Checking Android project..."

          if [ ! -d "android" ]; then
            echo "❌ Android folder was not created!"
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "❌ gradlew was not created!"
            exit 1
          fi

          if [ ! -d "android/app" ]; then
            echo "❌ Android app folder was not created!"
            exit 1
          fi

          echo "✅ Android project created successfully."
          echo "✅ gradlew found."
          echo "✅ app folder found."

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "❌ APK was not generated!"
            exit 1
          fi

          echo "✅ APK generated successfully."
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: masahpro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
